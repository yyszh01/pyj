[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pybrace"
dynamic = ["version"]
description = "Write Python with braces and semicolons; .pyj files run transparently and tracebacks point back to the source"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "yyszh01" }]
keywords = ["python", "syntax", "transpiler", "braces", "curly-braces", "import-hook", "whitespace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/yyszh01/pyj"
Issues = "https://github.com/yyszh01/pyj/issues"
Source = "https://github.com/yyszh01/pyj"

[project.scripts]
pyj = "pyj:main"

[tool.hatch.version]
path = "pyj.py"

[tool.hatch.build.targets.wheel]
only-include = ["pyj.py"]

# Ship the .pth so every Python process in the environment supports .pyj; pip uninstall removes it
[tool.hatch.build.targets.wheel.force-include]
"pyj_autoload.pth" = "pyj_autoload.pth"

[tool.hatch.build.targets.sdist]
include = ["pyj.py", "pyj_autoload.pth", "tests/", "examples/", "README.md", "README.zh-CN.md", "LICENSE"]
