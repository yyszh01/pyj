name: VS Code extension release

# Push a tag vscode-v<version> (the version in vscode/package.json), e.g.
#   git tag vscode-v0.1.0 && git push origin vscode-v0.1.0
# Tests and packages the extension, attaches the .vsix to a GitHub Release (no token needed),
# and publishes it to Open VSX when the repository has an OVSX_PAT secret (skipped otherwise).
# A push to main that changes this file creates the release for the current version when its
# tag exists but the release does not (to retry without moving the tag).
on:
  push:
    tags: ["vscode-v*"]
    branches: [main]
    paths: [".github/workflows/vscode-release.yml"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # the tags, to check out the release tag below

      - name: Which version
        id: v
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="vscode-v$(node -p "require('./vscode/package.json').version")"
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo "Tag $tag does not exist yet: nothing to do"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
            git checkout -q "$tag"
          fi
          version=$(node -p "require('./vscode/package.json').version")
          [ "vscode-v$version" = "$tag" ] || { echo "Tag $tag does not match vscode/package.json ($version)"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.v.outputs.go == 'true'
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        if: steps.v.outputs.go == 'true'
        with:
          python-version: "3.x"

      - name: Test and package
        if: steps.v.outputs.go == 'true'
        working-directory: vscode
        run: |
          npm ci --ignore-scripts
          npm test
          npx --no-install vsce package --no-dependencies

      - name: Release notes from vscode/CHANGELOG.md
        if: steps.v.outputs.go == 'true'
        working-directory: vscode
        run: |
          v="${{ steps.v.outputs.version }}"
          awk -v v="$v" '/^## /{ if (on) exit; if (index($0, "## " v) == 1) { on = 1; next } } on' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "See [vscode/CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/vscode/CHANGELOG.md)." > notes.md
          cat >> notes.md <<EOF

          ### Install

          Download **pyj-$v.vsix** below, then in VS Code or code-server: Extensions view → **⋯** → **Install from VSIX…**
          Or from a terminal: \`code --install-extension pyj-$v.vsix\` (\`code-server --install-extension pyj-$v.vsix\`).

          To run .pyj files you also need pyj itself; the extension offers to install it. See the [installation guide](https://github.com/${{ github.repository }}/tree/main/vscode#installing-pyj).
          EOF
          cat notes.md

      - name: GitHub Release
        if: steps.v.outputs.go == 'true'
        working-directory: vscode
        run: |
          # on failure, repeat gh's message as an annotation (readable without signing in)
          if ! out=$(gh release create "${{ steps.v.outputs.tag }}" "pyj-${{ steps.v.outputs.version }}.vsix" \
               --verify-tag --title "VS Code extension ${{ steps.v.outputs.version }}" --notes-file notes.md --latest=false 2>&1); then
            echo "$out"; echo "::error title=gh release create::$(echo "$out" | tr '\n' ' ' | cut -c1-500)"; exit 1
          fi
          echo "$out"

      - name: Publish to Open VSX
        if: steps.v.outputs.go == 'true' && env.OVSX_PAT != ''
        working-directory: vscode
        run: |
          npx --no-install ovsx create-namespace "$(node -p "require('./package.json').publisher")" || echo "(namespace already exists)"
          npx --no-install ovsx publish --packagePath "pyj-${{ steps.v.outputs.version }}.vsix"
