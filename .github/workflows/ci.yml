name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # 3.8 / 3.9 (end of life, but still the system Python on RHEL 9 family, Debian 11, Ubuntu 20.04):
        # Windows here, Linux in the legacy-linux job below (official python images)
        include:
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.9" }
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          [ "$status" -ne 0 ] && python .github/scripts/annotate_unittest.py test-output.txt
          exit "$status"

      - name: Run the single file without installing
        run: python pyj.py run examples/demo.pyj
        # match / case: 3.10+ only
      - name: match example (3.10+)
        if: ${{ !contains(fromJSON('["3.8", "3.9"]'), matrix.python) }}
        run: python pyj.py run examples/match.pyj

      - name: Transparent execution after pip install
        working-directory: examples
        run: |
          python -m pip install ..
          python demo.pyj
          python -c "import demo"
          pyj build demo.pyj -o -

  legacy-linux:
    name: linux (python:${{ matrix.python }}-slim) / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          [ "$status" -ne 0 ] && python .github/scripts/annotate_unittest.py test-output.txt
          exit "$status"

      - name: Run the single file without installing
        run: python pyj.py run examples/demo.pyj

      - name: Transparent execution after pip install
        working-directory: examples
        run: |
          python -m pip install ..
          python demo.pyj
          python -c "import demo"
          pyj build demo.pyj -o -
